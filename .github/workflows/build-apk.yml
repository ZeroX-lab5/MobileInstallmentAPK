name: Build Mobile Installment APK

on: workflow_dispatch:

permissions: contents: read

jobs: build: runs-on: ubuntu-latest steps: - name: Checkout repository uses: actions/checkout@v4

 
  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android project
    run: unzip -q MobileInstallment_Android_Project.zip -d .

  - name: Build debug APK
    run: gradle -p mobile_installment_app assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MobileInstallment-debug-APK
      path: mobile_installment_app/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
 
